benchmarks:
  - name: Merge independent dependency edits
    exec: benchmarks/cli merge
  - name: Merge using final workspace manifests
    exec: benchmarks/cli merge-context
  - name: Validate workspace settings and member declarations
    exec: benchmarks/cli validate-workspace
  - name: Converge optional peer drift after an install
    exec: benchmarks/cli converge
  - name: Repair a missing snapshot from Git history
    exec: benchmarks/cli repair
  - name: Inspect peer bindings and workspace reachability
    exec: benchmarks/cli inspect
  - name: Inspect external links across 1000 projects
    exec: benchmarks/cli inspect-external-1000
  - name: Inspect external links across 4000 projects
    exec: benchmarks/cli inspect-external-4000
