<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<title id="title">pnpm v9 Lockfile Three-Layer Graph Model</title>
<desc id="desc">A pnpm v9.0 lockfile forms a three-layer graph: workspace importers point into peer-encoded snapshots, and multiple snapshots of the same release share one packages metadata record.</desc>
<defs>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#182D45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-ink-start" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M8.5 1.5 1.5 5 8.5 8.5" fill="none" stroke="#182D45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#067A73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-teal-start" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M8.5 1.5 1.5 5 8.5 8.5" fill="none" stroke="#067A73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#A96712" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-amber-start" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M8.5 1.5 1.5 5 8.5 8.5" fill="none" stroke="#A96712" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#2B64C6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arr-blue-start" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M8.5 1.5 1.5 5 8.5 8.5" fill="none" stroke="#2B64C6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="620" fill="#FFFFFF"/>
<text x="36" y="44" fill="#182D45" font-size="24" font-weight="600" text-anchor="start" xml:space="preserve"><tspan x="36" dy="0">How pnpm v9.0 Represents a Dependency Graph</tspan></text>
<text x="36" y="68" fill="#53677E" font-size="14.5" font-weight="400" text-anchor="start" xml:space="preserve"><tspan x="36" dy="0">Two workspace projects using lib@1.0.0 with different peer providers produce two snapshots but share one packages record</tspan></text>
<path d="M36 86H1404" stroke="#CBD7E4" stroke-width="1.3"/>
<rect x="36" y="110" width="376" height="404" rx="11" fill="#F5F8FC" stroke="#CBD7E4" stroke-width="1.5"/>
<text x="54" y="138" fill="#152F4B" font-size="17" font-weight="600" text-anchor="start" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace"><tspan x="54" dy="0">1  importers</tspan></text>
<text x="394" y="137" fill="#53677E" font-size="13" font-weight="400" text-anchor="end" xml:space="preserve"><tspan x="394" dy="0">Workspace entry points</tspan></text>
<rect x="54" y="158" width="340" height="148" rx="8" fill="#FFFFFF" stroke="#CBD7E4" stroke-width="1.5"/>
<path d="M55 166V298" stroke="#2B64C6" stroke-width="3.5" stroke-linecap="round"/>
<text x="70" y="188" fill="#182D45" font-size="15" font-weight="600" text-anchor="start" xml:space="preserve"><tspan x="70" dy="0">importers[&quot;.&quot;]</tspan></text>
<text x="70" y="212" fill="#53677E" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace"><tspan x="70" dy="0">a:   *      → 3.0.0</tspan><tspan x="70" dy="19">b:   2.0.0  → 2.0.0</tspan><tspan x="70" dy="19">lib: 1.0.0  → 1.0.0(a@3.0.0)(b@2.0.0)</tspan></text>
<rect x="54" y="330" width="340" height="148" rx="8" fill="#FFFFFF" stroke="#CBD7E4" stroke-width="1.5"/>
<path d="M55 338V470" stroke="#067A73" stroke-width="3.5" stroke-linecap="round"/>
<text x="70" y="360" fill="#182D45" font-size="15" font-weight="600" text-anchor="start" xml:space="preserve"><tspan x="70" dy="0">importers[&quot;packages/web&quot;]</tspan></text>
<text x="70" y="384" fill="#53677E" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace"><tspan x="70" dy="0">a:   ^2.0.0 → 2.0.0</tspan><tspan x="70" dy="19">b:   1.0.0  → 1.0.0</tspan><tspan x="70" dy="19">lib: 1.0.0  → 1.0.0(a@2.0.0)(b@1.0.0)</tspan></text>
<rect x="472" y="110" width="500" height="404" rx="11" fill="#F5F8FC" stroke="#CBD7E4" stroke-width="1.5"/>
<text x="490" y="138" fill="#2B64C6" font-size="17" font-weight="600" text-anchor="start" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace"><tspan x="490" dy="0">2  snapshots</tspan></text>
<text x="954" y="137" fill="#53677E" font-size="13" font-weight="400" text-anchor="end" xml:space="preserve"><tspan x="954" dy="0">Installed instances (peer suffix = identity)</tspan></text>
<rect x="490" y="158" width="464" height="102" rx="8" fill="#EDF4FF" stroke="#CBD7E4" stroke-width="1.5"/>
<path d="M491 166V252" stroke="#2B64C6" stroke-width="3.5" stroke-linecap="round"/>
<text x="506" y="188" fill="#182D45" font-size="15" font-weight="600" text-anchor="start" xml:space="preserve"><tspan x="506" dy="0">lib@1.0.0(a@3.0.0)(b@2.0.0)</tspan></text>
<text x="506" y="212" fill="#53677E" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan x="506" dy="0">dependencies: { a: 3.0.0, b: 2.0.0 }</tspan><tspan x="506" dy="19">Instance bound to root app&#x27;s peer providers</tspan></text>
<rect x="490" y="282" width="464" height="102" rx="8" fill="#EAF7F4" stroke="#CBD7E4" stroke-width="1.5"/>
<path d="M491 290V376" stroke="#067A73" stroke-width="3.5" stroke-linecap="round"/>
<text x="506" y="312" fill="#182D45" font-size="15" font-weight="600" text-anchor="start" xml:space="preserve"><tspan x="506" dy="0">lib@1.0.0(a@2.0.0)(b@1.0.0)</tspan></text>
<text x="506" y="336" fill="#53677E" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan x="506" dy="0">dependencies: { a: 2.0.0, b: 1.0.0 }</tspan><tspan x="506" dy="19">Distinct instance for packages/web&#x27;s peers</tspan></text>
<rect x="490" y="406" width="234" height="86" rx="8" fill="#FFFFFF" stroke="#CBD7E4" stroke-width="1.4"/>
<text x="506" y="432" fill="#182D45" font-size="14.5" font-weight="600" text-anchor="start" xml:space="preserve"><tspan x="506" dy="0">Leaf snapshots</tspan></text>
<text x="506" y="456" fill="#53677E" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace"><tspan x="506" dy="0">a@3.0.0 · b@2.0.0</tspan><tspan x="506" dy="18">a@2.0.0 · b@1.0.0</tspan></text>
<rect x="738" y="406" width="216" height="86" rx="8" fill="#FFFFFF" stroke="#CBD7E4" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="754" y="432" fill="#53677E" font-size="14.5" font-weight="600" text-anchor="start" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace"><tspan x="754" dy="0">orphan@0.9.0</tspan></text>
<text x="754" y="456" fill="#53677E" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve"><tspan x="754" dy="0">Unreachable from importers</tspan><tspan x="754" dy="18">merge prunes · repair keeps</tspan></text>
<rect x="1032" y="110" width="372" height="404" rx="11" fill="#F5F8FC" stroke="#CBD7E4" stroke-width="1.5"/>
<text x="1050" y="138" fill="#067A73" font-size="17" font-weight="600" text-anchor="start" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, monospace"><tspan x="1050" dy="0">3  packages</tspan></text>
<text x="1386" y="137" fill="#53677E" font-size="13" font-weight="400" text-anchor="end" xml:space="preserve"><tspan x="1386" dy="0">Shared release metadata</tspan></text>
<rect x="1050" y="198" width="336" height="152" rx="8" fill="#FFFFFF" stroke="#CBD7E4" stroke-width="1.5"/>
<path d="M1051 206V342" stroke="#152F4B" stroke-width="3.5" stroke-linecap="round"/>
<text x="1066" y="228" fill="#182D45" font-size="15.5" font-weight="600" text-anchor="start" xml:space="preserve"><tspan x="1066" dy="0">lib@1.0.0  (shared once)</tspan></text>
<text x="1066" y="252" fill="#53677E" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan x="1066" dy="0">resolution: { integrity: sha512-lib }</tspan><tspan x="1066" dy="19">peerDependencies:</tspan><tspan x="1066" dy="19">  a: &#x27;*&#x27;   b: &#x27;*&#x27;</tspan><tspan x="1066" dy="19">One metadata record for all instances</tspan></text>
<rect x="1050" y="380" width="336" height="112" rx="8" fill="#FFFFFF" stroke="#CBD7E4" stroke-width="1.5"/>
<path d="M1051 388V484" stroke="#152F4B" stroke-width="3.5" stroke-linecap="round"/>
<text x="1066" y="410" fill="#182D45" font-size="15" font-weight="600" text-anchor="start" xml:space="preserve"><tspan x="1066" dy="0">Peer release records</tspan></text>
<text x="1066" y="434" fill="#53677E" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan x="1066" dy="0">a@3.0.0 · resolution: sha512-a3</tspan><tspan x="1066" dy="19">b@2.0.0 · resolution: sha512-b2</tspan><tspan x="1066" dy="19">a@2.0.0 · b@1.0.0</tspan></text>
<path d="M394 210 L488 210" fill="none" stroke="#2B64C6" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<path d="M394 334 L488 334" fill="none" stroke="#067A73" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)"/>
<text x="441" y="200" fill="#2B64C6" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve"><tspan x="441" dy="0">selects</tspan></text>
<text x="441" y="324" fill="#067A73" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve"><tspan x="441" dy="0">selects</tspan></text>
<path d="M954 210 L1002 210 L1002 256 L1048 256" fill="none" stroke="#2B64C6" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-blue)"/>
<path d="M954 334 L1002 334 L1002 292 L1048 292" fill="none" stroke="#067A73" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-teal)"/>
<text x="1002" y="200" fill="#53677E" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve"><tspan x="1002" dy="0">shares</tspan></text>
<path d="M607 492 L607 506 L1002 506 L1002 440 L1048 440" fill="none" stroke="#182D45" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-ink)"/>
<rect x="36" y="536" width="1368" height="58" rx="8" fill="#EDF4FF" stroke="#CBD7E4" stroke-width="1.3"/>
<text x="56" y="571" fill="#182D45" font-size="14.5" font-weight="500" text-anchor="start" xml:space="preserve"><tspan x="56" dy="0">Why text merges break:  dropping a snapshot, duplicating a key, or keeping a stale peer suffix breaks reachability or peer bindings even when YAML parses.</tspan></text>
</svg>
