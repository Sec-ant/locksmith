[package]
name = "locksmith-cli"
description = "Command-line interface for merging, generating, converging, repairing and inspecting pnpm lockfiles"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "locksmith"
path = "src/main.rs"
doc = false

[features]
default = []
pnpmfile = ["dep:llrt_modules", "dep:rquickjs", "dep:tokio"]

[dependencies]
bpaf = { version = "0.9.29", features = ["derive"] }
locksmith = { package = "es-locksmith", path = "../locksmith" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
serde-saphyr.workspace = true
node-semver.workspace = true
glob.workspace = true
brace-expansion = "0.1.1"
json5 = "1.3.7"
tempfile.workspace = true
ureq = "3"
jiff = { version = "0.2", default-features = false, features = ["std"] }
base64.workspace = true
sha2.workspace = true
flate2 = "1"
tar = { version = "0.4", default-features = false }
llrt_modules = { version = "0.8.1-beta", optional = true, default-features = false, features = ["buffer", "fs", "path", "timers"] }
rquickjs = { version = "0.11", optional = true, default-features = false, features = ["futures", "loader"] }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "time"] }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
mimalloc = { version = "0.1.52", features = ["v2", "no_thp"] }

[dev-dependencies]
percent-encoding = "2"
