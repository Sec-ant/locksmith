[package]
name = "locksmith-cli"
description = "Command-line interface for merging, converging, repairing, validating, and inspecting pnpm lockfiles"
repository = "https://github.com/Sec-ant/locksmith"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "locksmith"
path = "src/main.rs"
doc = false

[features]
bench-profile = ["locksmith/bench-profile"]

[dependencies]
anstream = "1"
anstyle = "1"
clap = { version = "4", features = ["derive", "wrap_help", "color", "suggestions", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
similar = "2"
locksmith = { package = "es-locksmith", path = "../locksmith" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
serde-saphyr.workspace = true
node-semver.workspace = true
glob.workspace = true
brace-expansion = "0.1.1"
json5 = "1.3.7"
tempfile.workspace = true
ureq = "3"
jiff = { version = "0.2", default-features = false, features = ["std"] }
base64.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
mimalloc = { version = "0.1.52", features = ["v2", "no_thp"] }

[dev-dependencies]
percent-encoding = "2"
