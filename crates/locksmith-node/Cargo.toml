[package]
name = "locksmith-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

# The #[napi] macro supplies the unsafe Node-API glue. Handwritten code stays safe.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
locksmith = { package = "es-locksmith", path = "../locksmith" }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[build-dependencies]
napi-build = "2"
