[package]
versioned_files = [
    "Cargo.toml",
    { path = "Cargo.lock", dependency = "es-locksmith" },
    { path = "Cargo.lock", dependency = "locksmith-cli" },
]
changelog = "CHANGELOG.md"
assets = "dist/*"

[changes]
ignore_conventional_commits = true

[github]
owner = "Sec-ant"
repo = "locksmith"

[bot.checks]
enabled = false

[bot.releases]
enabled = true
pull_request.title = "chore(release): v$version"

[[workflows]]
name = "change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"
