[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.3.4"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["serialize", "deserialize"] }
thiserror = "1"
node-semver = { package = "nodejs-semver", version = "7", features = ["serde"] }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.23"
ryu-js = "1"
glob = "0.3"
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
