[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["serialize", "deserialize"] }
thiserror = "2"
node-semver = "2.2"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
