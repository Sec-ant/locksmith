default_install_hook_types: [commit-msg]
repos:
  - repo: local
    hooks:
      - id: conventional-commit
        name: Conventional Commit
        language: rust
        additional_dependencies: ["cli:cocogitto:7.0.0"]
        entry: >-
          sh -c 'git rev-parse --verify --quiet MERGE_HEAD >/dev/null || exec cog -q verify --ignore-fixup-commits --file "$1"' --
        stages: [commit-msg]
