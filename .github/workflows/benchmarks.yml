name: CLI benchmarks

on:
  pull_request:
    paths: &inputs
      - 'Cargo.*'
      - 'crates/*/Cargo.toml'
      - 'crates/*/src/**'
      - 'benchmarks/**'
      - 'examples/converge/**'
      - 'codspeed.yaml'
      - '.github/workflows/benchmarks.yml'
  push:
    branches: [main]
    paths: *inputs
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.1
      - run: cargo build --locked --release -p locksmith-cli
      - name: Prepare worktree and verify outputs
        id: prepare
        run: |
          scratch=$(mktemp -d)
          echo "LOCKSMITH_BENCH_DIR=$scratch" >> "$GITHUB_ENV"
          echo "$PWD/target/release" >> "$GITHUB_PATH"
          PATH="$PWD/target/release:$PATH" sh benchmarks/prepare.sh "$scratch"
      - name: Check CLI wall time on the same runner
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          cargo build --manifest-path "$RUNNER_TEMP/base/Cargo.toml" --locked --release -p locksmith-cli
          base="$RUNNER_TEMP/base/target/release/locksmith"
          head="$PWD/target/release/locksmith"
          for case in merge:merged converge:ours repair:base; do
            operation=${case%:*}
            LOCKSMITH_BIN="$base" LOCKSMITH_OUTPUT="$RUNNER_TEMP/base-result" benchmarks/cli "$operation"
            cmp "$LOCKSMITH_BENCH_DIR/${case#*:}.yaml" "$RUNNER_TEMP/base-result"
          done
          rustc --edition=2024 benchmarks/compare.rs -o "$RUNNER_TEMP/compare"
          "$RUNNER_TEMP/compare" "$base" "$head" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Measure CPU and memory with CodSpeed
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation,memory
