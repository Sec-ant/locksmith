name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      (github.event_name == 'push' && github.actor != 'knope-bot[bot]') ||
      (github.event.pull_request.merged == true &&
       github.head_ref == 'knope/release' &&
       github.event.pull_request.user.login == 'knope-bot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - name: Resolve release version and commit
        id: metadata
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "locksmith-cli") | .version')
          tag="v$version"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME must match package version $tag." >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  binary:
    needs: prepare
    strategy:
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.prepare.outputs.tag }}
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Build and check the native CLI
        shell: bash
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 build --release --locked --bin locksmith --target "$TARGET"
          cd "target/$TARGET/release"
          test "$(./locksmith --version)" = "locksmith ${TAG#v}"
          tar -czf "$GITHUB_WORKSPACE/locksmith-$TARGET.tar.gz" locksmith
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: locksmith-*.tar.gz
          if-no-files-found: error

  publish:
    needs: [prepare, binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-homebrew
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release and update its Homebrew formula
        shell: bash
        run: |
          cd dist
          sha256sum locksmith-*.tar.gz > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
          cd ..
          mkdir -p Formula
          visibility=$(gh repo view --json visibility --jq '.visibility | ascii_downcase')
          sh scripts/homebrew-formula.sh "${TAG#v}" dist/SHA256SUMS "$visibility" > Formula/locksmith.rb
          # A draft can exist before GitHub creates its tag. Any existing tag must match the build.
          tag_ref="refs/tags/$TAG"
          refs=$(git ls-remote origin "$tag_ref" "$tag_ref^{}")
          tagged_commit=$(awk -v ref="$tag_ref" '$2 == ref { tag = $1 } $2 == ref "^{}" { peeled = $1 } END { print peeled ? peeled : tag }' <<< "$refs")
          if [[ -n "$tagged_commit" && "$tagged_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Tag $TAG already points to $tagged_commit, expected $RELEASE_COMMIT." >&2
            exit 1
          fi
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              echo "Knope Bot's draft release $TAG is missing. Rerun this job once the draft is available." >&2
              exit 1
            fi
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes dist/*
          elif [[ "$draft" == true ]]; then
            gh release upload "$TAG" --clobber dist/*
            gh release edit "$TAG" --target "$RELEASE_COMMIT" --draft=false
          else
            gh release download "$TAG" --pattern SHA256SUMS --output - | cmp - dist/SHA256SUMS
          fi
          latest=$(gh release view --json tagName --jq .tagName)
          if [[ "$latest" == "$TAG" ]]; then
            git add Formula/locksmith.rb
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build: update Homebrew formula to $TAG"
              git pull --rebase
              git push
            fi
          fi

  publish-crate:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-crate-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Check whether the crate version is published
        id: version
        shell: bash
        run: |
          status=$(curl --silent --show-error --retry 3 --max-time 30 \
            --user-agent 'Sec-ant/locksmith release (https://github.com/Sec-ant/locksmith)' \
            --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/es-locksmith/${TAG#v}")
          case "$status" in
            200) echo 'publish=false' >> "$GITHUB_OUTPUT" ;;
            404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io returned HTTP $status for es-locksmith ${TAG#v}." >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.version.outputs.publish == 'true'
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - if: steps.version.outputs.publish == 'true'
        run: rustup toolchain install 1.89.0 --profile minimal
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.version.outputs.publish == 'true'
        id: crates-io-auth
      - name: Publish es-locksmith
        if: steps.version.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo +1.89.0 publish --locked --package es-locksmith
